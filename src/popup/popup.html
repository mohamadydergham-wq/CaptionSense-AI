<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaptionSense AI</title>
  <link rel="stylesheet" href="styles/popup.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/theme.css">
</head>
<body>
  <div id="root" class="popup-container">
    <header class="popup-header">
      <div class="header-content">
        <h1>CaptionSense AI</h1>
        <button id="settings-btn" class="icon-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24M19.78 19.78l-4.24-4.24m-5.08-5.08l-4.24-4.24"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="popup-content">
      <!-- Status Section -->
      <section class="status-section">
        <div class="status-card">
          <div class="status-indicator" id="status-indicator"></div>
          <div class="status-text">
            <p class="status-label" id="status-label">Ready</p>
            <p class="status-time" id="status-time">--:--</p>
          </div>
        </div>
      </section>

      <!-- Controls Section -->
      <section class="controls-section">
        <button id="start-btn" class="btn btn-primary" data-state="idle">
          <span>Start Recording</span>
        </button>
        <button id="stop-btn" class="btn btn-danger" disabled>
          <span>Stop Recording</span>
        </button>
      </section>

      <!-- Live Transcript -->
      <section class="transcript-section">
        <div class="section-header">
          <h2>Live Transcript</h2>
          <button id="clear-transcript-btn" class="icon-btn small" title="Clear">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        </div>
        <div id="transcript-container" class="transcript-container">
          <p class="empty-state">No transcript yet. Start recording to begin.</p>
        </div>
      </section>

      <!-- Tone & Sentiment Display -->
      <section class="analysis-section">
        <div class="analysis-item">
          <label>Tone</label>
          <div id="tone-display" class="tone-display">--</div>
        </div>
        <div class="analysis-item">
          <label>Sentiment</label>
          <div id="sentiment-display" class="sentiment-display">--</div>
        </div>
      </section>

      <!-- Features Toggle -->
      <section class="features-section">
        <div class="feature-toggle">
          <label for="tone-toggle">Tone Detection</label>
          <input type="checkbox" id="tone-toggle" checked>
        </div>
        <div class="feature-toggle">
          <label for="sentiment-toggle">Sentiment Analysis</label>
          <input type="checkbox" id="sentiment-toggle" checked>
        </div>
        <div class="feature-toggle">
          <label for="translation-toggle">Translation</label>
          <input type="checkbox" id="translation-toggle">
        </div>
      </section>

      <!-- Export Section -->
      <section class="export-section">
        <div class="section-header">
          <h3>Export Transcript</h3>
        </div>
        <div class="button-group">
          <button id="export-txt-btn" class="btn btn-small">TXT</button>
          <button id="export-md-btn" class="btn btn-small">Markdown</button>
          <button id="export-pdf-btn" class="btn btn-small">PDF</button>
          <button id="export-json-btn" class="btn btn-small">JSON</button>
        </div>
      </section>

      <!-- Summary Section -->
      <section class="summary-section">
        <button id="generate-summary-btn" class="btn btn-secondary" disabled>
          Generate Summary
        </button>
        <div id="summary-container" class="summary-container hidden">
          <h3>Meeting Summary</h3>
          <div id="summary-content"></div>
        </div>
      </section>
    </main>

    <footer class="popup-footer">
      <p>v1.0.0 | <a href="#" id="feedback-link">Send Feedback</a></p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
